name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon.png'
      - 'css/**'
      - 'js/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 确保 Android SDK 35 组件可用
        run: |
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$SDKROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "$SDKROOT/platforms" || true

      - name: Install dependencies
        run: npm ci

      - name: Build offline assets and sync to Android project
        run: |
          npm run build:app
          npx cap sync android

      - name: Assemble debug APK
        run: |
          # Windows 提交的 gradlew 可能带 CRLF，Linux runner 上会报 bad interpreter
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nengchima-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
